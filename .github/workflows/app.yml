name: app

# What GitHub runs for the app. The whole check does not run on a pull request (the owner, 2026-11-11). The merge gate
# of a release is one whole `dev.py check` of the release branch, run by hand: the same command, in a different place.
#
#   - `changes` (Linux, about ten seconds): the repository names no one (scripts/check_no_one.py). On every pull request,
#     and when the workflow is started by hand.
#   - `check` (Windows): `app/scripts/dev.py check`, the whole check command, then the migrations compared with main.
#     Only when the workflow is started by hand (Actions, "Run workflow", or `gh workflow run app.yml --ref <branch>`),
#     for when a second opinion is wanted. On a pull request it is skipped, which counts as passed: nothing is
#     left pending, and no branch protection names it.
#
# Neither runs on a push to main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Built to share (docs/PRD.md 2.8): no machine, address or path of one person in the repository. The private-terms
      # half of the check needs a private-terms file kept outside the repository, so it runs locally; CI runs the shape rules.
      - name: Check the repository names no one
        run: python3 scripts/check_no_one.py

  check:
    name: check (windows)
    # Never on a pull request: only when the workflow is started by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # The whole history: the migrations check compares with main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/frontend/lint/package-lock.json
      # What dev.py builds once (its Python environments and tools), kept between runs and keyed on what they are made
      # from. The backend's tests need no database server: each worker makes its own SQLite file, so there is nothing else to fetch.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/resumebot-dev
          key: windows-dev-${{ hashFiles('app/backend/requirements-dev.lock', 'app/scripts/dev.py') }}
      - name: Check, natively
        env:
          RESUMEBOT_DEV_HOME: ${{ runner.temp }}/resumebot-dev
        run: python app/scripts/dev.py check
      # A released migration is never edited (its docstring and comments may be), and nothing runs a downgrade. Compared
      # with main, as the script does by default when it is run by hand.
      - name: Check the migrations only go forward
        if: ${{ !cancelled() }}
        run: python scripts/check_migrations.py origin/main
