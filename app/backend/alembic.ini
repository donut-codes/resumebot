# Alembic. The app runs `upgrade head` itself on every start (app/db.py: init_schema), with the database URL
# it was started with; this file only says where the scripts are. By hand:
#   JOBSEARCH_DATABASE_URL=postgresql+asyncpg://... alembic upgrade head
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
